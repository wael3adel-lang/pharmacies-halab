<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>صيدليات حلب المناوبة</title>

    <meta
        name="description"
        content="دليل الصيدليات المناوبة في مدينة حلب"
    >

    <!-- الخط العربي -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="site-header">

        <div class="header-content">

            <div class="brand">

                <div class="brand-title">
                    صيدليات حلب المناوبة
                </div>

                <div class="brand-subtitle">
                    اعثر على الصيدلية المناوبة الأقرب إليك
                </div>

            </div>

            <div class="last-update">
                آخر تحديث:
                <span id="lastUpdate">اليوم</span>
            </div>

        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="container">

        <!-- البحث -->

        <section class="search-section">

            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="ابحث عن اسم الصيدلية أو الحي أو العنوان..."
                    autocomplete="off"
                >

                <button id="clearSearch" class="clear-search">
                    ×
                </button>

            </div>

        </section>


        <!-- ================= FILTERS ================= -->

        <section class="filters">

            <button
                class="filter-button active"
                data-area="الكل"
            >
                الكل
            </button>

            <button
                class="filter-button"
                data-area="الجميلية"
            >
                الجميلية
            </button>

            <button
                class="filter-button"
                data-area="الشعار"
            >
                الشعار
            </button>

            <button
                class="filter-button"
                data-area="الميدان"
            >
                الميدان
            </button>

            <button
                class="filter-button"
                data-area="السكري"
            >
                السكري
            </button>

            <button
                class="filter-button"
                data-area="الفرقان"
            >
                الفرقان
            </button>

            <button
                class="filter-button"
                data-area="سيف الدولة"
            >
                سيف الدولة
            </button>

            <button
                class="filter-button"
                data-area="الحمدانية"
            >
                الحمدانية
            </button>

        </section>


        <!-- ================= CONTENT ================= -->

        <section class="content-layout">


            <!-- قائمة الأحياء -->

            <aside class="areas-panel">

                <div class="panel-header">

                    <div>
                        <h2>أحياء حلب</h2>

                        <span id="areasCount">
                            جميع الأحياء
                        </span>
                    </div>

                </div>


                <div class="area-search">

                    <input
                        type="text"
                        id="areaSearch"
                        placeholder="ابحث عن حي..."
                    >

                </div>


                <div
                    id="areasList"
                    class="areas-list"
                >
                </div>

            </aside>


            <!-- الصيدليات -->

            <section class="pharmacies-section">

                <div class="section-top">

                    <div>

                        <h1 id="selectedArea">
                            جميع الصيدليات المناوبة
                        </h1>

                        <p id="resultsText">
                            الصيدليات المناوبة حالياً
                        </p>

                    </div>

                    <div class="results-number">
                        <strong id="pharmacyCount">0</strong>
                        <span>صيدلية</span>
                    </div>

                </div>


                <!-- البطاقات -->

                <div
                    id="pharmaciesList"
                    class="pharmacies-grid"
                >
                </div>


                <!-- لا توجد نتائج -->

                <div
                    id="noResults"
                    class="no-results hidden"
                >

                    <h3>
                        لا توجد نتائج
                    </h3>

                    <p>
                        جرّب البحث باسم آخر أو اختر حياً مختلفاً.
                    </p>

                </div>

            </section>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="site-footer">

        <div>
            دليل الصيدليات المناوبة في حلب
        </div>

        <div>
            يتم تحديث البيانات بشكل دوري
        </div>

    </footer>


    <script src="script.js"></script>

</body>
</html>
