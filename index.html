<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#087a72">

    <meta name="description"
          content="دليل الصيدليات المناوبة في حلب">

    <title>صيدليات حلب المناوبة</title>

    <!-- الخط الرسمي -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #087a72;
            --primary-dark: #05635d;
            --background: #f4f7f8;
            --card: #ffffff;
            --text: #172331;
            --muted: #71808f;
            --border: #dce4e7;
            --hover: #eef8f6;
        }

        body {
            font-family: "Cairo", sans-serif;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
        }

        /* =========================
           HEADER
        ========================== */

        .header {
            background: #ffffff;
            padding: 28px 4%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
            border-bottom: 1px solid #e6ebed;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .logo {
            width: 68px;
            height: 68px;
            border: 3px solid var(--primary);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 30px;
            font-weight: 700;
        }

        .brand-text h1 {
            font-size: 34px;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.4;
        }

        .brand-text p {
            color: var(--muted);
            font-size: 17px;
            margin-top: 3px;
        }

        .creator {
            text-align: left;
            direction: ltr;
            white-space: nowrap;
        }

        .creator .update {
            font-size: 15px;
            color: var(--muted);
            margin-bottom: 5px;
        }

        .creator .by {
            font-size: 15px;
            color: var(--primary);
            font-weight: 600;
        }

        /* =========================
           SEARCH AREA
        ========================== */

        .search-area {
            background: var(--primary);
            padding: 30px 4%;
        }

        .search-box {
            max-width: 1400px;
            margin: auto;
            display: flex;
            gap: 14px;
        }

        .search-box input {
            flex: 1;
            height: 64px;
            border: none;
            outline: none;
            border-radius: 14px;
            padding: 0 25px;
            font-family: "Cairo", sans-serif;
            font-size: 17px;
            color: var(--text);
            background: #ffffff;
        }

        .search-box input::placeholder {
            color: #8b98a4;
        }

        .clear-btn {
            width: 130px;
            height: 64px;
            border: none;
            border-radius: 14px;
            background: #ffffff;
            color: var(--text);
            font-family: "Cairo", sans-serif;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .clear-btn:hover {
            background: #eef5f5;
        }

        /* =========================
           MAIN
        ========================== */

        main {
            max-width: 1450px;
            margin: 35px auto;
            padding: 0 24px;
        }

        .section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 32px;
            margin-bottom: 28px;
            box-shadow: 0 3px 15px rgba(20, 40, 50, 0.04);
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .section-title h2 {
            font-size: 30px;
            font-weight: 700;
            color: var(--text);
        }

        .section-title p {
            color: var(--muted);
            margin-top: 5px;
            font-size: 16px;
        }

        /* =========================
           DISTRICT SEARCH
        ========================== */

        .district-search {
            margin-bottom: 20px;
        }

        .district-search input {
            width: 100%;
            height: 56px;
            border: 1px solid var(--border);
            border-radius: 12px;
            outline: none;
            padding: 0 20px;
            font-family: "Cairo", sans-serif;
            font-size: 16px;
        }

        .district-search input:focus {
            border-color: var(--primary);
        }

        /* =========================
           DISTRICTS
        ========================== */

        .district-container {
            height: 390px;
            overflow-y: auto;
            padding: 5px 8px 5px 4px;
        }

        .district-container::-webkit-scrollbar {
            width: 8px;
        }

        .district-container::-webkit-scrollbar-track {
            background: #f0f3f4;
            border-radius: 10px;
        }

        .district-container::-webkit-scrollbar-thumb {
            background: #aab6ba;
            border-radius: 10px;
        }

        .district-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .district {
            height: 58px;
            background: #f8fafb;
            border: 1px solid var(--border);
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 12px;
            font-size: 16px;
            font-weight: 500;
            color: #273644;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .district:hover {
            background: var(--hover);
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
        }

        .district.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .no-districts {
            text-align: center;
            padding: 50px;
            color: var(--muted);
            font-size: 17px;
        }

        /* =========================
           PHARMACIES
        ========================== */

        .pharmacy-header {
            margin-bottom: 22px;
        }

        .pharmacy-header h2 {
            font-size: 30px;
        }

        .pharmacy-count {
            color: var(--muted);
            margin-top: 5px;
        }

        .pharmacy-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .pharmacy-card {
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 22px;
            background: #ffffff;
            transition: 0.2s;
        }

        .pharmacy-card:hover {
            border-color: #b8d9d5;
            box-shadow: 0 5px 20px rgba(0, 80, 75, 0.06);
        }

        .pharmacy-name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .pharmacy-district {
            color: var(--primary);
            font-size: 14px;
            margin-bottom: 14px;
        }

        .pharmacy-duty {
            background: #edf9f5;
            color: #087a72;
            border-radius: 9px;
            padding: 10px 12px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .pharmacy-address {
            background: #f6f8f9;
            border-radius: 9px;
            padding: 10px 12px;
            color: #5c6b77;
            font-size: 14px;
        }

        .empty-state {
            text-align: center;
            padding: 45px 20px;
            color: var(--muted);
        }

        .empty-state strong {
            display: block;
            color: var(--text);
            font-size: 20px;
            margin-bottom: 8px;
        }

        /* =========================
           FOOTER
        ========================== */

        footer {
            background: var(--primary);
            color: white;
            padding: 20px 4%;
            margin-top: 50px;
        }

        .footer-content {
            max-width: 1450px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        footer p {
            font-size: 14px;
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 900px) {

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .creator {
                text-align: right;
                direction: rtl;
            }

            .brand-text h1 {
                font-size: 27px;
            }

            .district-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .pharmacy-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {

            .header {
                padding: 22px 20px;
            }

            .brand {
                width: 100%;
            }

            .logo {
                width: 55px;
                height: 55px;
                font-size: 24px;
            }

            .brand-text h1 {
                font-size: 23px;
            }

            .brand-text p {
                font-size: 14px;
            }

            .creator {
                width: 100%;
            }

            .search-area {
                padding: 20px;
            }

            .search-box {
                flex-direction: column;
            }

            .search-box input,
            .clear-btn {
                width: 100%;
            }

            main {
                padding: 0 14px;
                margin-top: 20px;
            }

            .section {
                padding: 20px 16px;
                border-radius: 14px;
            }

            .section-title h2 {
                font-size: 24px;
            }

            .district-grid {
                grid-template-columns: 1fr;
            }

            .district-container {
                height: 350px;
            }

            .footer-content {
                flex-direction: column;
                text-align: center;
            }
        }

    </style>
</head>

<body>

<!-- =========================
     HEADER
========================== -->

<header class="header">

    <div class="brand">

        <!-- الشعار المؤقت -->
        <div class="logo">
            Rx
        </div>

        <div class="brand-text">

            <h1>
                صيدليات حلب المناوبة
            </h1>

            <p>
                اعثر على الصيدلية المناوبة الأقرب إليك
            </p>

        </div>

    </div>

    <div class="creator">

        <div class="update">
            آخر تحديث: <strong>اليوم</strong>
        </div>

        <div class="by">
            by: AMMAR MORGAN
        </div>

    </div>

</header>


<!-- =========================
     SEARCH
========================== -->

<section class="search-area">

    <div class="search-box">

        <input
            type="text"
            id="globalSearch"
            placeholder="ابحث باسم الصيدلية أو الحي أو العنوان..."
            autocomplete="off"
        >

        <button
            class="clear-btn"
            onclick="clearSearch()"
        >
            مسح
        </button>

    </div>

</section>


<!-- =========================
     MAIN
========================== -->

<main>


    <!-- الأحياء -->

    <section class="section">

        <div class="section-header">

            <div class="section-title">

                <h2>
                    أحياء حلب
                </h2>

                <p>
                    اختر الحي لعرض الصيدليات المناوبة فيه
                </p>

            </div>

        </div>


        <!-- البحث ضمن الأحياء -->

        <div class="district-search">

            <input
                type="text"
                id="districtSearch"
                placeholder="ابحث عن حي..."
                autocomplete="off"
            >

        </div>


        <!-- قائمة الأحياء -->

        <div class="district-container">

            <div
                class="district-grid"
                id="districtGrid"
            >

                <!-- سيتم توليد الأحياء بواسطة JavaScript -->

            </div>

        </div>

    </section>



    <!-- الصيدليات -->

    <section class="section">

        <div class="pharmacy-header">

            <h2>
                الصيدليات المناوبة
            </h2>

            <p
                class="pharmacy-count"
                id="pharmacyCount"
            >
                الصيدليات المناوبة حالياً
            </p>

        </div>


        <div
            class="pharmacy-grid"
            id="pharmacyGrid"
        >

        </div>

    </section>

</main>


<!-- =========================
     FOOTER
========================== -->

<footer>

    <div class="footer-content">

        <p>
            © 2026 جميع الحقوق محفوظة
        </p>

        <p>
            دليل الصيدليات المناوبة في حلب
        </p>

        <p>
            by: AMMAR MORGAN
        </p>

    </div>

</footer>


<script>

/* =====================================
   قائمة الأحياء
===================================== */

const districts = [

    "الميريديان",
    "حلب الجديدة",
    "الفرقان",
    "السكري",

    "صلاح الدين",
    "المشارقة",
    "الصاخور",
    "الحمدانية",

    "الراموسة",
    "الأنصاري",
    "الزبدية",
    "الكلاسة",

    "الأعظمية",
    "بستان القصر",
    "جمعية الزهراء",
    "الإذاعة",

    "الجميلية",
    "الشارع",
    "الميدان",
    "المرجة",

    "الشيخ طه",
    "السليمانية",
    "المحافظة",
    "السبيل",

    "الجميلية",
    "الفيض",
    "الفرات",
    "العرقوب",

    "باب الفرج",
    "باب النيرب",
    "الأشرفية",
    "الشيخ مقصود",

    "الهلك",
    "الإنذارات",
    "الشيخ خضر",
    "بعيدين",

    "الميسر",
    "الصالحين",
    "القاطرجي",
    "الشعار"

];


/* =====================================
   بيانات الصيدليات
   لاحقاً نستبدلها ببيانات Google Sheet
===================================== */

const pharmacies = [

    {
        name: "الصيدلية المركزية",
        district: "الميريديان",
        duty: "24 ساعة",
        address: "أمام الباب الخلفي لفندق الشيراتون"
    },

    {
        name: "محمد رزوق",
        district: "الشعار",
        duty: "حتى 1:30 ليلاً",
        address: "جانب كازية الشرق"
    },

    {
        name: "عصام",
        district: "الشعار",
        duty: "حتى 1:30 ليلاً",
        address: "الشعار - جانب جامع نور الشهداء"
    },

    {
        name: "عبد الرحمن",
        district: "الشعار",
        duty: "حتى 1:30 ليلاً",
        address: "بعد مشفى الشفاء أمام جامع عبد الرحمن"
    },

    {
        name: "شعار المركزية",
        district: "الشعار",
        duty: "حتى 1:30 ليلاً",
        address: "عند جسر الشعار"
    },

    {
        name: "الحكيم",
        district: "الشعار",
        duty: "حتى 1:30 ليلاً",
        address: "دوار الشعار - أول طريق الباب"
    },

    {
        name: "البسلم",
        district: "الشعار",
        duty: "حتى 1:30 ليلاً",
        address: "الشعار - طريق الباب"
    }

];


/* =====================================
   العناصر
===================================== */

const districtGrid =
    document.getElementById("districtGrid");

const districtSearch =
    document.getElementById("districtSearch");

const pharmacyGrid =
    document.getElementById("pharmacyGrid");

const pharmacyCount =
    document.getElementById("pharmacyCount");

const globalSearch =
    document.getElementById("globalSearch");


/* =====================================
   عرض الأحياء
===================================== */

function renderDistricts(list = districts) {

    districtGrid.innerHTML = "";

    if (list.length === 0) {

        districtGrid.innerHTML = `
            <div class="no-districts">
                لا توجد أحياء مطابقة للبحث
            </div>
        `;

        return;
    }


    list.forEach(district => {

        const button =
            document.createElement("button");

        button.className = "district";

        button.textContent = district;

        button.onclick = () => {

            selectDistrict(district);

        };

        districtGrid.appendChild(button);

    });

}


/* =====================================
   اختيار حي
===================================== */

function selectDistrict(district) {

    const buttons =
        document.querySelectorAll(".district");

    buttons.forEach(button => {

        button.classList.remove("active");

        if (button.textContent === district) {

            button.classList.add("active");

        }

    });


    const results =
        pharmacies.filter(
            pharmacy =>
                pharmacy.district === district
        );


    renderPharmacies(results);

}


/* =====================================
   عرض الصيدليات
===================================== */

function renderPharmacies(list) {

    pharmacyGrid.innerHTML = "";

    pharmacyCount.textContent =
        `عدد الصيدليات: ${list.length}`;


    if (list.length === 0) {

        pharmacyGrid.innerHTML = `

            <div class="empty-state">

                <strong>
                    لا توجد نتائج
                </strong>

                لا توجد صيدليات مناوبة مسجلة حالياً
                لهذا الاختيار.

            </div>

        `;

        return;

    }


    list.forEach(pharmacy => {

        const card =
            document.createElement("div");

        card.className =
            "pharmacy-card";


        card.innerHTML = `

            <div class="pharmacy-name">
                ${pharmacy.name}
            </div>

            <div class="pharmacy-district">
                ${pharmacy.district}
            </div>

            <div class="pharmacy-duty">
                ${pharmacy.duty}
            </div>

            <div class="pharmacy-address">
                ${pharmacy.address}
            </div>

        `;


        pharmacyGrid.appendChild(card);

    });

}


/* =====================================
   البحث عن حي
===================================== */

districtSearch.addEventListener(
    "input",
    function () {

        const search =
            this.value.trim().toLowerCase();


        const filtered =
            districts.filter(
                district =>
                    district
                    .toLowerCase()
                    .includes(search)
            );


        renderDistricts(filtered);

    }
);


/* =====================================
   البحث العام
===================================== */

globalSearch.addEventListener(
    "input",
    function () {

        const search =
            this.value.trim().toLowerCase();


        if (!search) {

            renderPharmacies(pharmacies);

            return;

        }


        const results =
            pharmacies.filter(pharmacy =>

                pharmacy.name
                    .toLowerCase()
                    .includes(search)

                ||

                pharmacy.district
                    .toLowerCase()
                    .includes(search)

                ||

                pharmacy.address
                    .toLowerCase()
                    .includes(search)

            );


        renderPharmacies(results);

    }
);


/* =====================================
   مسح البحث
===================================== */

function clearSearch() {

    globalSearch.value = "";

    districtSearch.value = "";

    renderDistricts();

    renderPharmacies(pharmacies);

}


/* =====================================
   التشغيل الأول
===================================== */

renderDistricts();

renderPharmacies(pharmacies);

</script>

</body>
</html>
